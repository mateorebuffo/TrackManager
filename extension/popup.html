<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 300px; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; color: #1e293b; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #0f172a; color: #fff; font-weight: 700; }
  header img { width: 20px; height: 20px; border-radius: 5px; }
  main { padding: 14px; }
  .msg { margin: 0 0 8px; }
  .ok { color: #065f46; }
  .warn { color: #92400e; }
  .err { color: #991b1b; }
  .track { font-weight: 600; word-break: break-word; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font: 12px ui-monospace, Consolas, monospace; }
  button { margin-top: 8px; padding: 6px 14px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
  button:hover { background: #4338ca; }
  .small { font-size: 12px; color: #64748b; margin-top: 10px; }
  a { color: #4f46e5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header><img src="icons/icon32.png" alt=""> Track Manager</header>
  <main>
    <div id="status" role="status" aria-live="polite"><p class="msg">Guardando…</p></div>

    <form id="token-form" hidden>
      <label for="token">Token del agente</label>
      <input id="token" type="password" autocomplete="off" required>
      <button type="submit">Guardar</button>
      <p class="small">Lo copiás desde <a href="https://trackmanager.app/settings" target="_blank">Config</a> en Track Manager.</p>
    </form>

    <p class="small" id="footer" hidden><a href="#" id="change-token">Cambiar token</a></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
