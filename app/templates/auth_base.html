<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} — Track Manager</title>
  <link rel="icon" type="image/svg+xml" href="/static/icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* La noche de la cabina (el color de la nav), sin tarjeta ni vidriera:
       es la puerta de una herramienta, no una landing. */
    :root {
      --bg: #0f172a; --line: #263147; --text: #e8e9f4; --muted: #9aa3b8;
      --field: #141d33; --primary: #5558e3; --primary-h: #4338ca; --focus: #6366f1;
      --error: #fca5a5; --ok: #6ee7b7;
      --display: "Unbounded", "Arial Black", system-ui, sans-serif;
      --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: 1fr auto; position: relative; overflow: hidden;
           background: var(--bg); color: var(--text); font: 400 0.95rem/1.55 var(--body); }
    footer { padding: 28px clamp(24px, 6vw, 96px); position: relative; z-index: 1; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 600; margin-bottom: 44px; }
    .brand img { width: 26px; height: 26px; }
    main { padding: 24px clamp(24px, 6vw, 96px); display: flex; align-items: center; justify-content: flex-end; position: relative; z-index: 1; }

    /* El vinilo: surcos con un gradiente radial repetido, el brillo con uno cónico que gira. */
    .vinyl { position: absolute; z-index: 0; width: 120vmin; height: 120vmin; left: -42vmin; top: 50%; margin-top: -60vmin;
             border-radius: 50%; background: repeating-radial-gradient(circle at center, #0a1020 0 1.6px, #1a2238 1.6px 3.4px);
             box-shadow: 0 0 0 1px #1f2a44, 40px 0 120px -40px rgba(0,0,0,.8); }
    .vinyl::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
             background: conic-gradient(from 0deg, transparent 0 18%, rgba(255,255,255,.07) 24%, transparent 30%,
                                        transparent 56%, rgba(255,255,255,.05) 62%, transparent 68%);
             animation: spin 24s linear infinite; }
    .vinyl::after { content: ""; position: absolute; inset: 36%; border-radius: 50%; background: var(--primary);
             background-image: radial-gradient(circle, var(--bg) 0 3.5%, transparent 3.6%), repeating-radial-gradient(circle, transparent 0 46%, rgba(255,255,255,.08) 46% 48%, transparent 48% 100%);
             box-shadow: 0 0 0 2px #0a1020; }
    .vinyl img { position: absolute; z-index: 1; left: 50%; top: 50%; width: 9vmin; transform: translate(-50%, -175%); opacity: .9; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Notas que salen del disco: nacen en el borde derecho del vinilo y suben
       abriéndose hacia el formulario, cada una con su deriva y su demora. */
    .notes { position: absolute; z-index: 0; left: 70vmin; top: 50%; width: 0; height: 0; pointer-events: none; }
    .notes i { position: absolute; left: 0; top: 0; font-size: var(--s, 3rem); color: var(--c, var(--focus)); opacity: 0;
               animation: rise var(--d, 7s) ease-out var(--w, 0s) infinite; }
    @keyframes rise {
      0%   { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(.6); }
      12%  { opacity: 1; }
      70%  { opacity: .85; }
      100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .vinyl::before { animation: none; }
      .notes i { animation: none; opacity: .7; transform: translate(calc(var(--x) * .4), calc(var(--y) * .4)) rotate(var(--r)); }
    }
    @media (max-width: 760px) { .vinyl, .notes { display: none; } main { justify-content: center; } }

    .form-wrap { width: 100%; max-width: 340px; }
    .form-wrap h1 { font: 700 2.2rem/1.1 var(--display); margin: 0 0 8px; letter-spacing: -0.01em; }
    .form-sub { color: var(--muted); margin: 0 0 32px; }
    .field { margin-bottom: 20px; }
    .field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    label { display: block; margin-bottom: 8px; font: 500 0.72rem/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .input { width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 0.65rem 0.8rem;
             font: inherit; color: var(--text); outline: none; transition: border-color .15s; }
    .input:focus { border-color: var(--focus); }
    .pw { position: relative; }
    .pw .input { padding-right: 2.6rem; }
    .pw button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px;
                 border: 0; background: none; color: var(--muted); border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .pw button:hover { color: var(--text); }
    .btn-main { display: grid; place-items: center; width: 100%; min-height: 44px; margin-top: 8px; border: 0; border-radius: 6px;
                background: var(--primary); color: #fff; font: 600 0.95rem var(--body); cursor: pointer; text-decoration: none; transition: background .15s; }
    .btn-main:hover { background: var(--primary-h); color: #fff; }
    a { color: var(--text); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
    a:hover { text-decoration-color: var(--text); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
    .small-link { font-size: 0.8rem; color: var(--muted); }
    .msg { border-left: 2px solid currentColor; padding: 0.2rem 0 0.2rem 0.8rem; font-size: 0.875rem; margin-bottom: 24px; }
    .msg.error { color: var(--error); }
    .msg.ok { color: var(--ok); }
    .form-foot { margin-top: 32px; font-size: 0.875rem; color: var(--muted); }
    .form-foot a { white-space: nowrap; }
    footer { display: flex; gap: 24px; font: 400 0.75rem var(--mono); color: var(--muted); }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }
  </style>
</head>
<body>
<div class="vinyl" aria-hidden="true"><img src="/static/icons/logo.svg" alt=""></div>
<div class="notes" aria-hidden="true">
  <i class="bi bi-music-note-beamed" style="--x:22vmin;--y:-34vmin;--r:-14deg;--d:7s;--w:0s"></i>
  <i class="bi bi-music-note" style="--x:34vmin;--y:-14vmin;--r:18deg;--d:6s;--w:1.2s;--s:2.2rem;--c:#8286f7"></i>
  <i class="bi bi-music-note-beamed" style="--x:30vmin;--y:10vmin;--r:-8deg;--d:7.5s;--w:2.6s;--s:2.6rem;--c:#e8e9f4"></i>
  <i class="bi bi-music-note" style="--x:16vmin;--y:-24vmin;--r:24deg;--d:6.5s;--w:3.8s;--c:#8286f7"></i>
  <i class="bi bi-music-note-beamed" style="--x:38vmin;--y:-28vmin;--r:10deg;--d:8s;--w:5s;--s:2.2rem"></i>
  <i class="bi bi-music-note" style="--x:26vmin;--y:22vmin;--r:-20deg;--d:7s;--w:6.2s;--s:2.4rem;--c:#e8e9f4"></i>
</div>
<main>
  <div class="form-wrap">
    <a class="brand" href="/para-que-sirve"><img src="/static/icons/logo.svg" alt=""> Track Manager</a>
    {% block form %}{% endblock %}
  </div>
</main>
<footer><span>trackmanager.app</span><a href="/para-que-sirve">Qué es Track Manager</a></footer>
<script>
function toggleField(id, btn) {
  const f = document.getElementById(id);
  if (!f) return;
  const show = f.type === 'password';
  f.type = show ? 'text' : 'password';
  if (btn) {
    btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    btn.querySelector('i').className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
  }
}
</script>
</body>
</html>
