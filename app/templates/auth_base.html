<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} — Track Manager</title>
  <link rel="icon" type="image/svg+xml" href="/static/icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* La noche de la cabina (el color de la nav), sin tarjeta ni vidriera:
       es la puerta de una herramienta, no una landing. */
    :root {
      --bg: #0f172a; --line: #263147; --text: #e8e9f4; --muted: #9aa3b8;
      --field: #141d33; --primary: #5558e3; --primary-h: #4338ca; --focus: #6366f1;
      --error: #fca5a5; --ok: #6ee7b7;
      --display: "Unbounded", "Arial Black", system-ui, sans-serif;
      --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: 1fr auto;
           background: var(--bg); color: var(--text); font: 400 0.95rem/1.55 var(--body); }
    main { display: flex; align-items: center; gap: clamp(24px, 5vw, 80px); padding: 32px clamp(24px, 6vw, 96px); }
    footer { display: flex; gap: 24px; padding: 20px clamp(24px, 6vw, 96px); font: 400 0.75rem var(--mono); color: var(--muted); }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 600; margin-bottom: 44px; }
    .brand img { width: 26px; height: 26px; }

    /* El DJ: silueta geométrica propia. Las bandejas giran (un grupo rotando dentro
       de otro aplastado da la perspectiva); se frenan con prefers-reduced-motion. */
    .art { flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: flex-end; }
    .art svg { width: 100%; height: auto; max-height: 82vh; }
    .spin { animation: spin 3.6s linear infinite; transform-origin: 0 0; transform-box: view-box; }
    .spin.slow { animation-duration: 5.2s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .scratch { animation: scratch 1.1s ease-in-out infinite alternate; }
    @keyframes scratch { to { transform: translateX(-10px); } }
    @media (prefers-reduced-motion: reduce) { .spin, .scratch { animation: none; } }
    @media (max-width: 860px) { .art { display: none; } main { justify-content: center; } }

    .form-wrap { width: 100%; max-width: 340px; flex: none; }
    .form-wrap h1 { font: 700 2.2rem/1.1 var(--display); margin: 0 0 8px; letter-spacing: -0.01em; }
    .form-sub { color: var(--muted); margin: 0 0 32px; }
    .field { margin-bottom: 20px; }
    .field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    label { display: block; margin-bottom: 8px; font: 500 0.72rem/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .input { width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 0.65rem 0.8rem;
             font: inherit; color: var(--text); outline: none; transition: border-color .15s; }
    .input:focus { border-color: var(--focus); }
    .pw { position: relative; }
    .pw .input { padding-right: 2.6rem; }
    .pw button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px;
                 border: 0; background: none; color: var(--muted); border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .pw button:hover { color: var(--text); }
    .btn-main { display: grid; place-items: center; width: 100%; min-height: 44px; margin-top: 8px; border: 0; border-radius: 6px;
                background: var(--primary); color: #fff; font: 600 0.95rem var(--body); cursor: pointer; text-decoration: none; transition: background .15s; }
    .btn-main:hover { background: var(--primary-h); color: #fff; }
    a { color: var(--text); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
    a:hover { text-decoration-color: var(--text); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
    .small-link { font-size: 0.8rem; color: var(--muted); }
    .msg { border-left: 2px solid currentColor; padding: 0.2rem 0 0.2rem 0.8rem; font-size: 0.875rem; margin-bottom: 24px; }
    .msg.error { color: var(--error); }
    .msg.ok { color: var(--ok); }
    .form-foot { margin-top: 32px; font-size: 0.875rem; color: var(--muted); }
    .form-foot a { white-space: nowrap; }
    footer { display: flex; gap: 24px; font: 400 0.75rem var(--mono); color: var(--muted); }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }
  </style>
</head>
<body>
<main>
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 900 560" fill="none">
      <defs>
        <g id="deck">
          <circle r="200" fill="#0a1020" stroke="#2a3652" stroke-width="3"/>
          <circle r="172" stroke="#1f2a44" stroke-width="2"/>
          <circle r="146" stroke="#1f2a44" stroke-width="2"/>
          <circle r="120" stroke="#1f2a44" stroke-width="2"/>
          <circle r="96" stroke="#1f2a44" stroke-width="2"/>
          <circle r="72" fill="#5558e3"/>
          <circle r="7" fill="#0a1020"/>
          <path d="M0 -80 V-190" stroke="rgba(255,255,255,.14)" stroke-width="10" stroke-linecap="round"/>
        </g>
      </defs>
      <!-- cuerpo: hombros caídos, cabeza inclinada sobre las bandejas -->
      <g fill="#e8e9f4">
        <path d="M300 520 C300 380 350 290 470 282 C590 290 640 380 640 520 Z"/>
        <path d="M438 230 l62 -8 l12 66 l-72 10 Z"/>
        <g transform="rotate(12 486 170)">
          <circle cx="486" cy="170" r="60"/>
          <path d="M426 170 c0-56 30-90 60-90 s60 34 60 90" stroke="#e8e9f4" stroke-width="16" stroke-linecap="round"/>
          <rect x="408" y="146" width="32" height="58" rx="13"/>
          <rect x="532" y="146" width="32" height="58" rx="13"/>
          <path d="M530 130 l62 6 l-12 20 l-50 -6 Z"/>
        </g>
      </g>
      <!-- cabina: mixer y bandejas -->
      <rect x="400" y="398" width="150" height="70" rx="8" fill="#141d33" stroke="#2a3652" stroke-width="2"/>
      <g fill="#2a3652"><circle cx="430" cy="418" r="6"/><circle cx="475" cy="418" r="6"/><circle cx="520" cy="418" r="6"/></g>
      <rect x="420" y="446" width="110" height="4" rx="2" fill="#2a3652"/>
      <rect x="486" y="438" width="14" height="20" rx="3" fill="#5558e3"/>
      <g transform="translate(225 450) scale(1 .36)"><g class="spin"><use href="#deck"/></g></g>
      <g transform="translate(705 440) scale(1 .36)"><g class="spin slow"><use href="#deck"/></g></g>
      <!-- brazos y manos, por encima de los discos -->
      <g class="scratch">
        <path d="M372 318 C330 350 280 390 238 426" stroke="#e8e9f4" stroke-width="58" stroke-linecap="round"/>
        <ellipse cx="226" cy="436" rx="48" ry="24" fill="#e8e9f4"/>
        <path d="M184 430 l-32 -10 M186 444 l-34 6 M198 456 l-24 16" stroke="#e8e9f4" stroke-width="12" stroke-linecap="round"/>
      </g>
      <path d="M568 318 C610 350 660 384 700 414" stroke="#e8e9f4" stroke-width="58" stroke-linecap="round"/>
      <ellipse cx="712" cy="422" rx="44" ry="22" fill="#e8e9f4"/>
      <path d="M752 414 l32 -6 M752 428 l32 8" stroke="#e8e9f4" stroke-width="11" stroke-linecap="round"/>
      <!-- frente de la cabina -->
      <rect x="40" y="500" width="820" height="60" rx="10" fill="#141d33"/>
      <path d="M40 504 H860" stroke="#2a3652" stroke-width="3"/>
    </svg>
  </div>
  <div class="form-wrap">
    <a class="brand" href="/para-que-sirve"><img src="/static/icons/logo.svg" alt=""> Track Manager</a>
    {% block form %}{% endblock %}
  </div>
</main>
<footer><span>trackmanager.app</span><a href="/para-que-sirve">Qué es Track Manager</a></footer>
<script>
function toggleField(id, btn) {
  const f = document.getElementById(id);
  if (!f) return;
  const show = f.type === 'password';
  f.type = show ? 'text' : 'password';
  if (btn) {
    btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    btn.querySelector('i').className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
  }
}
</script>
</body>
</html>
