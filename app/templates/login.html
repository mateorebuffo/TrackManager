<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Track Manager</title>
  <link rel="icon" type="image/svg+xml" href="/static/icons/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #0f172a;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99,102,241,.25) 0%, transparent 70%);
    }
    .auth-wrap {
      width: 100%;
      max-width: 360px;
      padding: 1rem;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-brand-icon {
      width: 48px; height: 48px;
      background: #6366f1;
      border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      margin-bottom: 0.9rem;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .auth-brand-name {
      display: block;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.2px;
    }
    .auth-brand-sub {
      display: block;
      font-size: 0.78rem;
      color: rgba(255,255,255,.62);
      margin-top: 0.15rem;
    }
    .auth-card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 24px 48px rgba(0,0,0,.35);
    }
    .auth-card h1 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 1.5rem;
    }
    .auth-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,.55);
      margin-bottom: 0.35rem;
      letter-spacing: 0.02em;
    }
    .auth-input {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      font-size: 0.9rem;
      color: #fff;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .auth-input::placeholder { color: rgba(255,255,255,.2); }
    .auth-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.2);
    }
    .auth-btn {
      width: 100%;
      background: #5558e3;
      border: none;
      border-radius: 8px;
      padding: 0.6rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
      margin-top: 0.25rem;
    }
    .auth-btn:hover { background: #4338ca; }
    .auth-error {
      background: rgba(239,68,68,.15);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 0.82rem;
      padding: 0.55rem 0.85rem;
      margin-bottom: 1.25rem;
    }
    .mb-form { margin-bottom: 1rem; }
    .mb-form-lg { margin-bottom: 1.5rem; }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-brand">
    <img class="auth-brand-icon" src="/static/icons/logo.svg" alt="">
    <span class="auth-brand-name">Track Manager</span>
    <span class="auth-brand-sub">Tu flujo de trabajo musical, en un solo lugar.</span>
  </div>
  <div class="auth-card">
    <h1 class="auth-title">Iniciar sesión</h1>
    {% if error %}
      <div class="auth-error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login" autocomplete="on">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-form">
        <label class="auth-label" for="login-username">Usuario</label>
        <input type="text" name="username" id="login-username" class="auth-input" autofocus autocomplete="username" required>
      </div>
      <div class="mb-form-lg">
        <label class="auth-label" for="login-password">Contraseña</label>
        <div style="position:relative;">
          <input type="password" name="password" id="login-password" class="auth-input" autocomplete="current-password" required style="padding-right:2.5rem;">
          <button type="button" aria-label="Mostrar u ocultar contraseña"
                  onclick="toggleField('login-password')"
                  style="position:absolute;right:0.65rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;line-height:1;color:rgba(255,255,255,.62);padding:0;display:flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button type="submit" class="auth-btn">Entrar</button>
    </form>
  </div>
</div>
<script>
function toggleField(id) {
  const f = document.getElementById(id);
  if (f) f.type = f.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
