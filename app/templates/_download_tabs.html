{# Pestañas compartidas por /tracks/download-queue y /auto-download/jobs.
   Uso: {% with active='queue' %}{% include "_download_tabs.html" %}{% endwith %} #}
<style>
  .tm-dtabs { display: inline-flex; gap: .15rem; background: #fff; border: 1px solid var(--tm-border); border-radius: 9px; padding: .3rem; margin-bottom: 1.25rem; box-shadow: var(--tm-shadow); }
  .tm-dtab { padding: .35rem .9rem; border-radius: 6px; font-size: .82rem; font-weight: 500; color: var(--tm-muted); text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; }
  .tm-dtab:hover { background: var(--tm-bg); color: var(--tm-text); }
  .tm-dtab.on { background: var(--tm-primary); color: #fff; }
  .tm-dtab .n { font-size: .72rem; font-weight: 700; background: rgba(0,0,0,.08); border-radius: 999px; padding: .1em .45em; }
  .tm-dtab.on .n { background: rgba(255,255,255,.25); }
</style>
{% set n = queued_count | default(0) %}
<nav class="tm-dtabs" aria-label="Secciones de descargas">
  <a href="/tracks/download-queue" class="tm-dtab {% if active == 'queue' %}on{% endif %}" {% if active == 'queue' %}aria-current="page"{% endif %}>
    <i class="bi bi-list-check"></i> En cola {% if n %}<span class="n">{{ n }}</span>{% endif %}
  </a>
  <a href="/auto-download/jobs" class="tm-dtab {% if active == 'jobs' %}on{% endif %}" {% if active == 'jobs' %}aria-current="page"{% endif %}>
    <i class="bi bi-clock-history"></i> Última descarga e historial
  </a>
</nav>
